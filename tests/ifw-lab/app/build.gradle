plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mikeyphw.trackerguard.ifwlab'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mikeyphw.trackerguard.ifwlab'
        minSdk 26
        targetSdk 35
        versionCode 1
        // R3 builds v2 only when CI explicitly supplies this property.
        if (project.hasProperty('tgLabVersionCode')) {
            versionCode Integer.parseInt(project.property('tgLabVersionCode').toString())
        }
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
