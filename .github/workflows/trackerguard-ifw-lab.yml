name: TrackerGuard IFW runtime lab APK
on:
  push:
    branches: ['feature/trackerguard-*']
    paths:
      - 'tests/ifw-lab/**'
      - '.github/workflows/trackerguard-ifw-lab.yml'
  pull_request:
    paths:
      - 'tests/ifw-lab/**'
      - '.github/workflows/trackerguard-ifw-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lab-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated test-app contract
        run: |
          python3 tests/ifw-lab/tests/test_contract.py
          sh -n tests/ifw-lab/run-device-test.sh
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK platform and build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build standalone debuggable test APK
        run: gradle --no-daemon -p tests/ifw-lab :app:assembleDebug --stacktrace
      - name: Validate APK metadata and no extra permissions
        shell: bash
        run: |
          set -euo pipefail
          APK=tests/ifw-lab/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/ifw-lab-badging.txt"
          grep -Fq "package: name='com.mikeyphw.trackerguard.ifwlab'" "$RUNNER_TEMP/ifw-lab-badging.txt"
          ! "$AAPT" dump permissions "$APK" | grep -q 'uses-permission:'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'ProbeReceiver'
          sha256sum "$APK"
      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: trackerguard-ifw-lab-debug
          path: tests/ifw-lab/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
