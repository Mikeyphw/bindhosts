name: TrackerGuard R1 native scanner, IFW tests and module ZIP
on:
  push:
    branches: ['feature/trackerguard-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: |
          sh -n module/trackerguard.sh
          sh -n module/trackerguard_r1.sh
          sh -n module/trackerguard_r2.sh
          sh -n module/bindhosts.sh
          sh -n module/service.sh
          bash -n module/customize.sh
          sh -n module/hosts_target_safe.sh
          sh -n module/hosts_control_safe.sh
          python3 tests/test_hosts_controls_ux08.py
          sh -n module/response_mode.sh
          sh -n module/hosts_reset_safe.sh
          sh -n module/uninstall.sh
      - name: R0 IFW behavior and rollback tests
        run: TG_R1_MODDIR="$PWD/module" sh tests/test_trackerguard.sh
      - name: R1 native binary manifest and CLI regression tests
        run: python3 tests/test_trackerguard_r1.py
      - name: KernelSU native scanner install permissions
        run: |
          python3 tests/test_scanner_install_permissions.py
          python3 tests/test_responder_install_permissions.py
      - name: R2 opt-in observer and automatic IFW reconciliation tests
        run: |
          python3 tests/test_trackerguard_r2.py
          python3 tests/test_trackerguard_r2_snapshot_hf02.py
      - name: UX03/UX04 regression tests
        run: |
          python3 tests/test_hosts_target_ux03.py
          python3 tests/test_blocked_response_ux04.py
          python3 tests/test_webui_ux0304.py
      - name: UX05 bounded activity and export regression tests
        run: |
          sh -n module/ux05_diagnostics.sh
          python3 tests/test_ux05_diagnostics.py
          python3 tests/test_ux05_contract.py
      - name: UX06 private backup regression tests
        run: |
          sh -n module/config_backup_safe.sh
          python3 tests/test_backup_safe_ux06.py
          python3 tests/test_webui_ux06.py
      - name: TrackerGuard R3 offline lifecycle and fail-closed tests
        run: |
          python3 tests/test_trackerguard_r3.py
          python3 tests/test_service_recovery_r3.py
          python3 -m py_compile tests/trackerguard-r3/run_device_acceptance.py
      - name: Setup Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          # Google removed the legacy SDK 'tools' package; install only platform-tools.
          packages: 'platform-tools'
      - name: Install pinned Android NDK
        run: sdkmanager --install 'ndk;27.2.12479018'
      - name: Compile Android scanner for supported ABIs
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for entry in 'arm64-v8a:aarch64-linux-android26-clang' 'armeabi-v7a:armv7a-linux-androideabi26-clang' 'x86_64:x86_64-linux-android26-clang'; do
            abi="${entry%%:*}"
            compiler="${entry#*:}"
            mkdir -p "module/bin/$abi"
            "$NDK/$compiler" -std=c11 -O2 -fPIE -pie -D_FORTIFY_SOURCE=2 \
              -Wall -Wextra -Werror native/axmlscan.c -o "module/bin/$abi/axmlscan"
            test -s "module/bin/$abi/axmlscan"
            chmod 0755 "module/bin/$abi/axmlscan"
            "$NDK/$compiler" -std=c11 -O2 -fPIE -pie -D_FORTIFY_SOURCE=2 \
              -Wall -Wextra -Werror native/blocked_response.c -o "module/bin/$abi/blocked_response"
            chmod 0755 "module/bin/$abi/blocked_response"
            file "module/bin/$abi/axmlscan"
          done
      - name: Setup Go for isolated HTTPS responder
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: UX07 host TLS, blocked-domain restriction and opt-in rollback tests
        run: |
          sh -n module/https_response.sh
          python3 tests/test_https_response_ux07.py
          python3 tests/test_https_install_permissions.py
          python3 tests/test_webui_ux07.py
      - name: Build Android HTTPS responder for all supported ABIs
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for entry in 'arm64-v8a:arm64:aarch64-linux-android26-clang' 'armeabi-v7a:arm:armv7a-linux-androideabi26-clang' 'x86_64:amd64:x86_64-linux-android26-clang'; do
            IFS=: read -r abi arch compiler <<< "$entry"
            mkdir -p "module/bin/$abi"
            GOOS=android GOARCH="$arch" CGO_ENABLED=1 CC="$NDK/$compiler" \
              go build -trimpath -ldflags='-s -w' -o "module/bin/$abi/blocked_response_tls" ./native/blocked_response_tls/main.go
            chmod 0755 "module/bin/$abi/blocked_response_tls"
            test -s "module/bin/$abi/blocked_response_tls"
          done
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml
      - name: Build existing bindhosts WebUI
        run: |
          cd webui
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../module/webroot/index.html
      - name: Validate module payload
        run: |
          test -s module/config_backup_safe.sh
          test -s module/ux05_diagnostics.sh
          test -s module/hosts_target_safe.sh
          test -s module/hosts_reset_safe.sh
          test -s module/response_mode.sh
          test -s module/https_response.sh
          for abi in arm64-v8a armeabi-v7a x86_64; do test -x "module/bin/$abi/blocked_response_tls"; done
          for abi in arm64-v8a armeabi-v7a x86_64; do test -x "module/bin/$abi/blocked_response"; done
          test -s module/data/r3-lab-signatures.tsv
          test -s module/data/tracker-signatures.tsv
          for abi in arm64-v8a armeabi-v7a x86_64; do test -x "module/bin/$abi/axmlscan"; done
          test -f module/webroot/index.html
          test -f module/META-INF/com/google/android/update-binary
      - name: Package installable module
        run: |
          cd module
          zip -qr "$RUNNER_TEMP/bindhosts-trackerguard-r1.zip" .
      - name: Upload installable module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: bindhosts-trackerguard-r1
          path: ${{ runner.temp }}/bindhosts-trackerguard-r1.zip
