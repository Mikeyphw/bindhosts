name: BH-APP01 Companion Foundation
on:
  pull_request:
    paths:
      - 'contracts/bh-app01-v1.json'
      - 'contracts/bh-app01-v2.json'
      - 'contracts/bh-app01-v3.json'
      - 'contracts/bh-app01-v4.json'
      - 'module/companion_api.sh'
      - 'module/companion_control_v2.sh'
      - 'module/companion_manage_v3.sh'
      - 'module/companion_read_v4.sh'
      - 'webui/runtime/companion_transport.mjs'
      - 'webui/vite.companion.config.js'
      - 'webui/runtime/companion_kernelsu_alt.mjs'
      - 'webui/runtime/companion_webuix.mjs'
      - 'android/companion/**'
      - 'tests/test_bh_app01_*'
      - 'scripts/ci/bh_app01_android_sdk.sh'
      - '.github/workflows/bh-app01-foundation.yml'
  push:
    branches:
      - 'feature/bh-app01-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source syntax, adversarial and API tests
        run: |
          set -euo pipefail
          sh -n module/companion_api.sh
          sh -n module/companion_control_v2.sh
          sh -n module/companion_manage_v3.sh
          sh -n module/companion_read_v4.sh
          python3 -m unittest discover -s tests -p 'test_bh_app01_*.py' -v
          node --check webui/runtime/companion_transport.mjs
          node --check android/companion/app/src/main/assets/app.js
          node tests/test_bh_app01_transport.mjs
          node --check webui/runtime/companion_kernelsu_alt.mjs
          node --check webui/runtime/companion_webuix.mjs
          node --check webui/vite.companion.config.js
          node tests/test_bh_app01_p04_runtime.mjs
          node tests/test_bh_app01_p05_runtime.mjs
          node tests/test_bh_app01_p04b_runtime.mjs
          node tests/test_bh_app01_p04b_pagination.mjs
          python3 -m json.tool contracts/bh-app01-v1.json >/dev/null
          python3 -m json.tool contracts/bh-app01-v2.json >/dev/null
          python3 -m json.tool contracts/bh-app01-v3.json >/dev/null
          python3 -m json.tool contracts/bh-app01-v4.json >/dev/null
      - name: Check contract and no native shell execution from WebUI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge=Path('android/companion/app/src/main/java/com/mikeyphw/bindhosts/MainActivity.java').read_text()
          api=Path('module/companion_api.sh').read_text()
          control=Path('module/companion_control_v2.sh').read_text()
          assert 'addJavascriptInterface' not in bridge
          assert 'addWebMessageListener' in bridge
          assert 'isMainFrame' in bridge
          assert 'unknown or write operation' in api
          assert 'unknown action' in control
          assert 'hosts read-back mismatch' in control
          print('BH_APP01_STATIC_GATE_PASS')
          PY
  android:
    runs-on: ubuntu-latest
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the same UX10 entrypoint with read-only native adapters
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@11.22.0
          pnpm --dir webui install --frozen-lockfile
          pnpm --dir webui exec vite build --config vite.companion.config.js
          python3 scripts/ci/bh_app01_p04_bundle_check.py
      - name: Install and verify Android SDK 36 (no obsolete tools package)
        shell: bash
        run: bash scripts/ci/bh_app01_android_sdk.sh
      - name: Build Android debug APK, unit tests and lint (GitHub-hosted only)
        run: gradle -p android/companion --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Record exact SHA and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd android/companion/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          printf '%s\n' '${{ github.sha }}' > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bh-app01-p05-verified-hosts-tiles-debug-${{ github.sha }}
          path: |
            android/companion/app/build/outputs/apk/debug/app-debug.apk
            android/companion/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/companion/app/build/outputs/apk/debug/source-commit.txt
          if-no-files-found: error
