name: BH-APP01 Companion Foundation
on:
  pull_request:
    paths:
      - 'contracts/bh-app01-v1.json'
      - 'module/companion_api.sh'
      - 'webui/runtime/companion_transport.mjs'
      - 'android/companion/**'
      - 'tests/test_bh_app01_*'
      - '.github/workflows/bh-app01-foundation.yml'
  push:
    branches:
      - 'feature/bh-app01-*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Source syntax, adversarial and API tests
        run: |
          set -euo pipefail
          sh -n module/companion_api.sh
          python3 -m unittest discover -s tests -p 'test_bh_app01_*.py' -v
          node --check webui/runtime/companion_transport.mjs
          node --check android/companion/app/src/main/assets/app.js
          node tests/test_bh_app01_transport.mjs
          python3 -m json.tool contracts/bh-app01-v1.json >/dev/null
      - name: Check contract and no native shell execution from WebUI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bridge=Path('android/companion/app/src/main/java/com/mikeyphw/bindhosts/MainActivity.java').read_text()
          api=Path('module/companion_api.sh').read_text()
          assert 'addJavascriptInterface' not in bridge
          assert 'addWebMessageListener' in bridge
          assert 'isMainFrame' in bridge
          assert 'unknown or write operation' in api
          print('BH_APP01_STATIC_GATE_PASS')
          PY
  android:
    runs-on: ubuntu-latest
    needs: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build unsigned-scope debug APK (no local Gradle)
        run: gradle -p android/companion --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Record exact SHA and checksum
        shell: bash
        run: |
          set -euo pipefail
          cd android/companion/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
          printf '%s\n' '${{ github.sha }}' > source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bh-app01-p03-debug-${{ github.sha }}
          path: |
            android/companion/app/build/outputs/apk/debug/app-debug.apk
            android/companion/app/build/outputs/apk/debug/SHA256SUMS.txt
            android/companion/app/build/outputs/apk/debug/source-commit.txt
          if-no-files-found: error
