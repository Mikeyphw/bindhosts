name: Release

# R1: NO automatic release until rooted Android IFW runtime qualification.
on:
  workflow_dispatch:
    inputs:
      qualified:
        description: 'Android 16 root/IFW runtime verified; publish release'
        required: true
        type: boolean
        default: false
permissions:
  contents: write

env:
  MODULE_NAME: 'bindhosts'

jobs:
  release:
    if: ${{ inputs.qualified == true }}
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ env.version_changed }}
      VERSION: ${{ env.VERSION }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Setup Android SDK tools
      uses: android-actions/setup-android@v4
      with:
        # Google removed the legacy SDK 'tools' package; install only platform-tools.
        packages: 'platform-tools'
    - name: Install pinned Android NDK
      run: sdkmanager --install 'ndk;27.2.12479018'
    - name: Build TrackerGuard Android native scanners
      shell: bash
      run: |
        set -euo pipefail
        NDK="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
        for entry in 'arm64-v8a:aarch64-linux-android26-clang' 'armeabi-v7a:armv7a-linux-androideabi26-clang' 'x86_64:x86_64-linux-android26-clang'; do
          abi="${entry%%:*}"; compiler="${entry#*:}"
          mkdir -p "module/bin/$abi"
          "$NDK/$compiler" -std=c11 -O2 -fPIE -pie -D_FORTIFY_SOURCE=2 -Wall -Wextra -Werror native/axmlscan.c -o "module/bin/$abi/axmlscan"
          chmod 0755 "module/bin/$abi/axmlscan"
          test -s "module/bin/$abi/axmlscan"
        done
    - name: R0 and R1 regression acceptance
      run: |
        TG_R1_MODDIR="$PWD/module" sh tests/test_trackerguard.sh
        python3 tests/test_trackerguard_r1.py

    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 'latest'

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        cache: 'pnpm'
        cache-dependency-path: webui/pnpm-lock.yaml

    - name: build webroot
      run: |
        cd webui
        pnpm install --frozen-lockfile
        pnpm build

    - name: Set variables
      id: setup
      run: |
        MODULE_DESC="Systemless hosts for APatch, KernelSU and Magisk."
        CURRENT_VERSION_CODE=$(jq -r .versionCode update.json)
        PREVIOUS_VERSION_CODE=$(jq -r .versionCode <(git show HEAD~1:update.json))
        COMMIT_ID=$(git rev-parse --short HEAD)
        echo "ZIP_NAME=${{ env.MODULE_NAME }}_${CURRENT_VERSION_CODE}-${COMMIT_ID}" >> $GITHUB_ENV
        echo "VERSION=$(jq -r .version update.json)" >> $GITHUB_ENV
        CHANGELOG_RAW=$(git diff HEAD^ HEAD -- "CHANGELOG.md" | grep '^+[^+]' | sed 's/^+//' || true)
        {
          echo "CHANGELOG<<EOF"
          echo -e "## ${{ env.MODULE_NAME }}\n${MODULE_DESC}\n\n---\n\n# Changelog:\n${CHANGELOG_RAW}"
          echo "EOF"
        } >> $GITHUB_ENV
        
        if [ "$CURRENT_VERSION_CODE" -gt "$PREVIOUS_VERSION_CODE" ]; then
          echo "version_changed=true" >> $GITHUB_ENV
        else
          echo "version_changed=false" >> $GITHUB_ENV
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ZIP_NAME }}
        path: 'module'

    - name: Download artifact
      if: ${{ env.version_changed == 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.MODULE_NAME }}

    - name: Zip module for release
      if: ${{ env.version_changed == 'true' }}
      run: |
        cd ${{ env.MODULE_NAME }}
        zip -r ../${{ env.MODULE_NAME }}.zip .
        cd ..

    - name: Create new release
      if: ${{ env.version_changed == 'true' }}
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: "${{ env.MODULE_NAME }}.zip"
        tag_name: "${{ env.VERSION }}"
        name: "Release ${{ env.VERSION }}"
        body: "${{ env.CHANGELOG }}"
        draft: false
        prerelease: false
