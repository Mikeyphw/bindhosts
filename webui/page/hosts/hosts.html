<div class="body-content constant-height">
    <div class="box translucent hosts-control-panel" id="hosts-controls-panel">
        <div class="hosts-control-heading">
            <h2>Blocking controls</h2>
            <md-text-button id="hosts-control-refresh" aria-label="Refresh blocking status">Refresh status</md-text-button>
        </div>
        <p id="hosts-control-status" class="hosts-control-status" role="status" aria-live="polite">Checking blocking status…</p>
        <p id="hosts-control-detail" class="hosts-control-detail">Read the actual hosts configuration before making changes.</p>
        <div class="hosts-control-actions">
            <md-filled-button id="hosts-control-toggle" disabled aria-label="Pause blocking">
                <md-icon slot="icon" id="hosts-control-toggle-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M240-760h160v560H240zm320 0h160v560H560z"/></svg></md-icon>
                <span id="hosts-control-toggle-label">Pause blocking</span>
            </md-filled-button>
            <md-outlined-button id="hosts-control-update" disabled aria-label="Update hosts">
                <md-icon slot="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M480-160q-133 0-226.5-93.5T160-480h80q0 100 70 170t170 70q100 0 170-70t70-170h80q0 133-93.5 226.5T480-160Zm0-560q-100 0-170 70t-70 170h-80q0-133 93.5-226.5T480-800q133 0 226.5 93.5T800-480h-80q0-100-70-170t-170-70Z"/></svg></md-icon>
                Update hosts
            </md-outlined-button>
        </div>
    </div>

    <!-- Source box -->
    <div class="box translucent">
        <div class="box-header">
            <h2 data-i18n="source_title"></h2>
            <md-outlined-icon-button class="help-btn" data-type="sources">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M424-320q0-81 14.5-116.5T500-514q41-36 62.5-62.5T584-637q0-41-27.5-68T480-732q-51 0-77.5 31T365-638l-103-44q21-64 77-111t141-47q105 0 161.5 58.5T698-641q0 50-21.5 85.5T609-475q-49 47-59.5 71.5T539-320H424Zm56 240q-33 0-56.5-23.5T400-160q0-33 23.5-56.5T480-240q33 0 56.5 23.5T560-160q0 33-23.5 56.5T480-80Z"/></svg></md-icon>
            </md-outlined-icon-button>
        </div>
        <div class="category-container">
            <div class="input-box-wrapper translucent">
                <textarea autocapitalize="off" class="input-box" rows="1" id="sources-input" type="text" placeholder="https://adaway.org/hosts.txt"></textarea>
            </div>
            <md-filled-icon-button class="add-btn" id="sources-add">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px"><path d="M417-417H166v-126h251v-251h126v251h251v126H543v251H417v-251Z"/></svg></md-icon>
            </md-filled-icon-button>
        </div>
        <div id="sources-list"></div>
    </div>

    <!-- Whitelist source box -->
    <div class="box translucent">
        <div class="box-header">
            <h2 data-i18n="sources_whitelist_title"></h2>
            <md-outlined-icon-button class="help-btn" data-type="sources_whitelist">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M424-320q0-81 14.5-116.5T500-514q41-36 62.5-62.5T584-637q0-41-27.5-68T480-732q-51 0-77.5 31T365-638l-103-44q21-64 77-111t141-47q105 0 161.5 58.5T698-641q0 50-21.5 85.5T609-475q-49 47-59.5 71.5T539-320H424Zm56 240q-33 0-56.5-23.5T400-160q0-33 23.5-56.5T480-240q33 0 56.5 23.5T560-160q0 33-23.5 56.5T480-80Z"/></svg></md-icon>
            </md-outlined-icon-button>
        </div>
        <div class="category-container">
            <div class="input-box-wrapper translucent">
                <textarea autocapitalize="off" class="input-box" rows="1" id="sources_whitelist-input" type="text" placeholder="https://example.com/whitelist_txt"></textarea>
            </div>
            <md-filled-icon-button class="add-btn" id="sources_whitelist-add">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px"><path d="M417-417H166v-126h251v-251h126v251h251v126H543v251H417v-251Z"/></svg></md-icon>
            </md-filled-icon-button>
        </div>

            </md-outlined-icon-button>
        </div>
        <div class="category-container">
            <div class="input-box-wrapper translucent">
                <textarea autocapitalize="off" class="input-box" rows="1" id="whitelist-input" type="text" placeholder="s.youtube.com"></textarea>
            </div>
            <md-filled-icon-button class="add-btn" id="whitelist-add">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px"><path d="M417-417H166v-126h251v-251h126v251h251v126H543v251H417v-251Z"/></svg></md-icon>
            </md-filled-icon-button>
        </div>
        <div id="whitelist-list"></div>
    </div>

    <!-- Blacklist box -->
    <div class="box translucent">
        <div class="box-header">
            <h2 data-i18n="blacklist_title"></h2>
            <md-outlined-icon-button class="help-btn" data-type="blacklist">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M424-320q0-81 14.5-116.5T500-514q41-36 62.5-62.5T584-637q0-41-27.5-68T480-732q-51 0-77.5 31T365-638l-103-44q21-64 77-111t141-47q105 0 161.5 58.5T698-641q0 50-21.5 85.5T609-475q-49 47-59.5 71.5T539-320H424Zm56 240q-33 0-56.5-23.5T400-160q0-33 23.5-56.5T480-240q33 0 56.5 23.5T560-160q0 33-23.5 56.5T480-80Z"/></svg></md-icon>
            </md-outlined-icon-button>
        </div>
        <div class="category-container">
            <div class="input-box-wrapper translucent">
                <textarea autocapitalize="off" class="input-box" rows="1" id="blacklist-input" type="text" placeholder="online-casino.com"></textarea>
            </div>
            <md-filled-icon-button class="add-btn" id="blacklist-add">

            </md-filled-icon-button>

    <!-- Custom box -->

        <div class="box-header">
            <h2 data-i18n="custom_title"></h2>
            <md-outlined-icon-button class="help-btn" data-type="custom">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M424-320q0-81 14.5-116.5T500-514q41-36 62.5-62.5T584-637q0-41-27.5-68T480-732q-51 0-77.5 31T365-638l-103-44q21-64 77-111t141-47q105 0 161.5 58.5T698-641q0 50-21.5 85.5T609-475q-49 47-59.5 71.5T539-320H424Zm56 240q-33 0-56.5-23.5T400-160q0-33 23.5-56.5T480-240q33 0 56.5 23.5T560-160q0 33-23.5 56.5T480-80Z"/></svg></md-icon>
            </md-outlined-icon-button>
        </div>
        <div class="category-container">
            <div class="input-box-wrapper translucent">
                <textarea autocapitalize="off" class="input-box" rows="1" id="custom-input" type="text" placeholder="93.184.215.14 example.com"></textarea>
            </div>
            <md-filled-icon-button class="add-btn" id="custom-add">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px"><path d="M417-417H166v-126h251v-251h126v251h251v126H543v251H417v-251Z"/></svg></md-icon>
            </md-filled-icon-button>

    <!-- Import custom hosts -->
    <div class="box translucent">
        <div class="box-header import">
            <h2 data-i18n="import_custom_title"></h2>
            <md-outlined-icon-button class="help-btn" data-type="import_custom">
                <md-icon><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960"><path d="M424-320q0-81 14.5-116.5T500-514q41-36 62.5-62.5T584-637q0-41-27.5-68T480-732q-51 0-77.5 31T365-638l-103-44q21-64 77-111t141-47q105 0 161.5 58.5T698-641q0 50-21.5 85.5T609-475q-49 47-59.5 71.5T539-320H424Zm56 240q-33 0-56.5-23.5T400-160q0-33 23.5-56.5T480-240q33 0 56.5 23.5T560-160q0 33-23.5 56.5T480-80Z"/></svg></md-icon>
            </md-outlined-icon-button>
        </div>
        <div id="import_custom-list"></div>
        <md-filled-icon-button class="import-button" id="import-custom-button">
            <md-icon><svg xmlns="http://www.w3.org/2000/svg" height="22px" viewBox="0 -960 960 960" width="22px"><path d="M417-417H166v-126h251v-251h126v251h251v126H543v251H417v-251Z"/></svg></md-icon>

    <!-- Safe inset -->
    <div class="placeholder"></div>
